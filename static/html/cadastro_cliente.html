<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro: Cliente</title>
    <link rel="stylesheet" href="../css/cadastro_cliente.css">
</head>
<body>
    <div class="background-logo"></div>
    <h1 class="title">➣ Cadastro: Cliente</h1>
    <div class="container">
        <form class="form-cadastro">
            <label class="label" for="nome">➤ Nome</label>
            <input class="input" type="text" id="nome" name="nome" autocomplete="off">

            <div class="row-group">
                <div class="row-item uf">
                    <label class="label" for="uf">➤ UF</label>
                    <select class="input select" id="uf" name="uf">
                        <option value="">Selecione</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AP">AP</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MT">MT</option>
                        <option value="MS">MS</option>
                        <option value="MG">MG</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PR">PR</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RS">RS</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="SC">SC</option>
                        <option value="SP">SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>
                </div>
                <div class="row-item cidade">
                    <label class="label" for="cidade">➤ Cidade</label>
                    <input class="input" type="text" id="cidade" name="cidade" autocomplete="off">
                </div>
                <div class="row-item cep">
                    <label class="label" for="cep">➤ CEP</label>
                    <input class="input" type="text" id="cep" name="cep" autocomplete="off">
                </div>
            </div>

            <label class="label" for="endereco">➤ Endereco</label>
            <input class="input" type="text" id="endereco" name="endereco" autocomplete="off">
        </form>
        <div class="buttons">
            <button class="btn" id="voltar">⮘ Voltar.</button>
            <div class="right-btns">
                <button class="btn" id="registro">Registro. ⮚</button>
                <button class="btn" id="confirmar">Confirmar. ⮚</button>
            </div>
        </div>
    </div>
    <script src="../js/cadastro_cliente.js"></script>
</body>
</html>
