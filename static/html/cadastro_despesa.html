<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro: Despesa</title>
    <link rel="stylesheet" href="../css/cadastro_despesa.css">
</head>
<body>
    <h1 class="title">➣ Cadastro: Despesa</h1>
    <div class="background-logo"></div>
    <div class="container">
        <form class="form-cadastro">
            <div class="row-group">
                <div class="row-item">
                    <label class="label" for="placa">➤ Placa</label>
                    <input class="input" type="text" id="placa" name="placa" autocomplete="off">
                </div>
                <div class="row-item">
                    <label class="label" for="prestador" id="label-prestador" style="cursor: help; position: relative;">
                        ➤ Prestador
                        <span class="tooltip" id="tooltip-prestador" style="display:none; position:absolute; left:0; top:2.2vw; background:rgba(0,0,0,0.85); color:#fff; padding:0.5vw 1vw; border-radius:0.7vw; font-size:1vw; white-space:nowrap; z-index:10;">Este campo indica o id do prestador</span>
                    </label>
                    <input class="input" type="text" id="prestador" name="prestador" autocomplete="off">
                </div>
                <div class="row-item">
                    <label class="label" for="data">➤ Data</label>
                    <input class="input" type="date" id="data" name="data" autocomplete="off">
                </div>
            </div>
            <div class="row-group">
                <div class="row-item" style="flex: 1 1 100%;">
                    <label class="label" for="valor_total">➤ Valor total</label>
                    <div class="input-group"><span class="input-prefix">R$</span><input class="input" type="text" id="valor_total" name="valor_total" autocomplete="off" style="padding-left:3vw;"></div>
                </div>
            </div>
            <div class="row-group">
                <div class="row-item" style="flex: 1 1 100%;">
                    <label class="label" for="descricao">➤ Descrição</label>
                    <textarea class="input" id="descricao" name="descricao" rows="4" style="resize:none;"></textarea>
                </div>
            </div>
        </form>
        <div class="buttons">
            <button class="btn" id="voltar">⮘ Voltar.</button>
            <div class="right-btns">
                <button class="btn" id="registro">Registro. ⮚</button>
                <button class="btn" id="confirmar">Confirmar. ⮚</button>
            </div>
        </div>
    </div>
    <script src="../js/cadastro_despesa.js"></script>
</body>
</html>
